name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt found issues; run 'gofmt -w .'"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - run: go mod verify

      - run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: vet and lint every target platform
        run: |
          for platform in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${platform%/*}; arch=${platform#*/}
            echo "::group::$os/$arch"
            GOOS=$os GOARCH=$arch go vet ./...
            GOOS=$os GOARCH=$arch golangci-lint run --max-same-issues 0 --max-issues-per-linter 0 ./...
            echo "::endgroup::"
          done

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          actionlint .github/workflows/*.yml

      - name: Build
        run: go build -trimpath ./...

  dist:
    name: Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: VERSION=0.0.0-dev-${GITHUB_SHA::7} make dist

      - uses: actions/upload-artifact@v7
        with:
          name: multidig-dev-${{ github.sha }}
          path: dist/*
          retention-days: 14
